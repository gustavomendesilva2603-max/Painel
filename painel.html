<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Alunos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* Sobrescritas pelo tema do cliente (meu_tema) após o login.
       Os valores abaixo são só o fallback da tela de login. */
    --primaria:#39556A;
    --escura:#2C4356;
    --destaque:#BEDA49;
    --bg:#F4F6F3;
    --ink:#22333F;
    --err:#C4321F;

    --card:#FFFFFF;
    --ink-soft:#5C7183;
    --line:#DDE3E0;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px;width:100%}
  .conteudo{flex:1;width:100%;padding-bottom:40px}

  /* ================= LOGIN ================= */
  #telaLogin{
    position:fixed;inset:0;z-index:80;background:var(--escura);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  #telaLogin.sumiu{display:none}
  .login-card{
    background:var(--card);border-radius:18px;padding:32px 28px;
    width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.3);
  }
  .login-card .marca{text-align:center;margin-bottom:22px}
  .login-card .marca img{max-height:56px;max-width:200px;margin:0 auto 10px;display:none}
  .login-card .marca img.mostrar{display:block}
  .login-card h1{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
  .login-card .sub{font-size:.85rem;color:var(--ink-soft);margin-top:4px}
  .login-card label{display:block;font-size:.8rem;font-weight:700;color:var(--ink-soft);margin:14px 0 6px}
  .login-card input{
    width:100%;padding:12px 14px;font-size:1rem;border:1.5px solid var(--line);
    border-radius:10px;background:#FBFAF7;color:var(--ink);
  }
  .login-card input:focus{outline:none;border-color:var(--primaria);box-shadow:0 0 0 3px rgba(57,85,106,.14)}
  .login-card button{
    width:100%;margin-top:20px;padding:13px;font-size:1rem;font-weight:800;
    color:var(--escura);background:var(--destaque);border:none;border-radius:10px;cursor:pointer;
  }
  .login-card button:disabled{opacity:.6;cursor:wait}
  #loginErro{
    display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:.85rem;
    background:#FBE7E3;color:var(--err);border:1px solid var(--err);font-weight:600;
  }
  #loginErro.mostrar{display:block}

  .spinner{
    width:32px;height:32px;border:3px solid rgba(255,255,255,.25);
    border-top-color:#fff;border-radius:50%;animation:gira .8s linear infinite;
  }
  @keyframes gira{to{transform:rotate(360deg)}}

  /* ================= HEADER ================= */
  header{background:var(--escura);padding:20px 0 34px}
  .header-flex{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .header-esq{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  #logoCard{background:#fff;border-radius:12px;padding:8px 16px;display:none;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  #logoCard.mostrar{display:block}
  #logoSolto{display:none}
  #logoSolto.mostrar{display:block}
  header img{height:52px;width:auto;display:block}
  .header-title{color:#F4F6F3}
  .header-title .tag{display:inline-block;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--destaque);font-weight:800;margin-bottom:4px}
  .header-title h1{font-size:clamp(1.3rem,3.5vw,1.8rem);font-weight:800;letter-spacing:-.02em}
  .header-dir{display:flex;align-items:center;gap:12px;color:rgba(244,246,243,.7);font-size:.8rem}
  .btn-sair{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#F4F6F3;
    padding:7px 14px;border-radius:999px;font-size:.8rem;font-weight:700;cursor:pointer;
  }
  .btn-sair:hover{background:rgba(255,255,255,.2)}

  /* ================= STATS ================= */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:-20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;border-top:3px solid var(--primaria)}
  .stat .num{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
  .stat .lbl{font-size:.73rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .stat.destaque{border-top-color:var(--destaque)}
  .stat.vermelho{border-top-color:var(--err)}
  .stat.vermelho .num{color:var(--err)}

  /* ================= CONTROLES ================= */
  .controles{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 16px;align-items:center}
  .busca{flex:1;min-width:220px;position:relative}
  .busca input{width:100%;padding:11px 14px 11px 38px;font-size:.95rem;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .busca::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.85rem;opacity:.5}
  .busca input:focus{outline:none;border-color:var(--primaria);box-shadow:0 0 0 3px rgba(57,85,106,.14)}
  .filtros{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:9px 16px;font-size:.85rem;font-weight:600;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;transition:all .15s;color:var(--ink-soft)}
  .chip.on{background:var(--primaria);border-color:var(--primaria);color:#fff}

  /* ================= LISTA ================= */
  .lista{display:flex;flex-direction:column;gap:10px}
  .aluno{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;cursor:pointer;transition:border-color .15s, box-shadow .15s;
    display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;
    border-left:4px solid var(--line);
  }
  .aluno.at{border-left-color:var(--destaque)}
  .aluno:hover{border-color:var(--primaria);box-shadow:0 2px 10px rgba(44,67,86,.1)}
  .aluno .nome{font-weight:700;font-size:1.02rem}
  .aluno .sub{font-size:.82rem;color:var(--ink-soft);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .badge{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
  .b-ativo{background:#EDF5D4;color:#5C7414}
  .b-inativo{background:#E8ECEA;color:var(--ink-soft)}
  .b-fechou{background:var(--destaque);color:var(--escura)}
  .b-nao-fechou{background:#FFF0E0;color:#9A5A12}
  .b-atrasado{background:#FBE7E3;color:var(--err)}
  .vazio{text-align:center;padding:50px 20px;color:var(--ink-soft)}
  .vazio strong{display:block;font-size:1.05rem;color:var(--ink);margin-bottom:6px}
  .carregando{text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:.9rem}

  /* ================= MODAL ================= */
  .overlay{position:fixed;inset:0;background:rgba(34,51,63,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .overlay.aberto{display:flex}
  .modal{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:0 0 30px}
  @media(min-width:740px){.overlay{align-items:center;padding:24px}.modal{border-radius:18px}}
  .modal-top{position:sticky;top:0;background:var(--escura);color:#F4F6F3;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:18px 18px 0 0;z-index:2}
  .modal-top h2{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
  .fechar{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex-shrink:0}
  .modal-body{padding:18px 22px 0}

  .gestao{background:var(--card);border:2px solid var(--destaque);border-radius:var(--radius);padding:18px;margin-bottom:18px}
  .gestao h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--primaria);margin-bottom:14px}
  .gestao-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .g-item .g-lbl{font-size:.8rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block}
  .toggle{display:flex;gap:8px}
  .toggle button{flex:1;padding:10px;font-size:.88rem;font-weight:700;border-radius:10px;border:1.5px solid var(--line);background:#FAFBF8;cursor:pointer;transition:all .15s;color:var(--ink-soft)}
  .toggle button.sel-destaque{background:var(--destaque);border-color:var(--destaque);color:var(--escura)}
  .toggle button.sel-cinza{background:#5C7183;border-color:#5C7183;color:#fff}
  .toggle button.sel-laranja{background:#E8862E;border-color:#E8862E;color:#fff}
  input[type=date]{width:100%;padding:10px 12px;font-size:.95rem;border:1.5px solid var(--line);border-radius:10px;background:#FAFBF8;color:var(--ink)}
  input[type=date]:focus{outline:none;border-color:var(--primaria);box-shadow:0 0 0 3px rgba(57,85,106,.14)}
  textarea{
    width:100%;padding:10px 12px;font-size:.92rem;border:1.5px solid var(--line);
    border-radius:10px;background:#FAFBF8;color:var(--ink);resize:vertical;min-height:70px;
    font-family:inherit;
  }
  textarea:focus{outline:none;border-color:var(--primaria);box-shadow:0 0 0 3px rgba(57,85,106,.14)}
  .salvar{width:100%;margin-top:16px;padding:13px;font-size:.98rem;font-weight:800;color:var(--escura);background:var(--destaque);border:none;border-radius:10px;cursor:pointer;letter-spacing:.02em}
  .salvar:hover{filter:brightness(1.05)}
  .salvar:disabled{opacity:.6;cursor:wait}
  .salvo-msg{display:none;text-align:center;font-size:.85rem;font-weight:700;margin-top:10px}
  .salvo-msg.ok{display:block;color:#5C7414}
  .salvo-msg.falha{display:block;color:var(--err)}

  .secao{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
  .secao h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--primaria);margin-bottom:12px;border-bottom:1.5px solid var(--line);padding-bottom:8px}
  .dado{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:.9rem;border-bottom:1px dashed #EAEEEC}
  .dado:last-child{border-bottom:none}
  .dado .k{color:var(--ink-soft);flex-shrink:0}
  .dado .v{font-weight:600;text-align:right}
  .alerta-saude .v{color:var(--err)}

  .zap-btn{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;font-weight:700;font-size:.88rem;padding:9px 16px;border-radius:999px;text-decoration:none;margin-bottom:16px}
  .treino-btn{display:inline-flex;align-items:center;gap:8px;background:var(--primaria);color:#fff;font-weight:700;font-size:.88rem;padding:9px 16px;border-radius:999px;text-decoration:none}
  .treino-btn:hover{filter:brightness(1.1)}

  /* ===== Solicitações pendentes ===== */
  .sol-box{background:#FFF7E8;border:1.5px solid #E8A33D;border-radius:var(--radius);padding:14px 16px;margin-top:20px}
  .sol-box h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:#8A5A12;font-weight:800;margin-bottom:10px}
  .sol-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(232,163,61,.25);flex-wrap:wrap}
  .sol-item:last-child{border-bottom:none}
  .sol-item .quem{font-weight:700;font-size:.92rem}
  .sol-item .quando{font-size:.78rem;color:var(--ink-soft)}
  .sol-tipo{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:#E8A33D;color:#fff}
  .sol-acoes{display:flex;gap:6px}
  .sol-btn{padding:6px 12px;border-radius:8px;font-size:.78rem;font-weight:700;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-decoration:none;color:var(--ink)}
  .sol-btn.ok{background:var(--destaque);border-color:var(--destaque);color:var(--escura)}

  /* ===== Engajamento no card do aluno ===== */
  .badge-sumido{background:#FFE8E4;color:var(--err)}
  .badge-firme{background:#EDF5D4;color:#5C7414}

  /* ===== Gráfico de peso ===== */
  .grafico-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
  .grafico-wrap h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--primaria);margin-bottom:12px}
  .grafico-vazio{text-align:center;color:var(--ink-soft);font-size:.85rem;padding:14px 0}
  .mini-stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.82rem}
  .mini-stats b{display:block;font-size:1.1rem;color:var(--ink)}
  .mini-stats span{color:var(--ink-soft)}

  /* ================= RODAPÉ ================= */
  footer{margin-top:auto;background:var(--escura);color:#F4F6F3;padding:26px 0}
  .foot-flex{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .foot-brand{font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
  .contatos{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem}
  .contatos a{color:#F4F6F3;text-decoration:none;display:inline-flex;align-items:center;gap:7px;opacity:.9}
  .contatos a:hover{color:var(--destaque);opacity:1}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<!-- ================= TELA DE LOGIN ================= -->
<div id="telaLogin">
  <div class="login-card" id="loginCard">
    <div class="marca">
      <img id="loginLogo" alt="">
      <h1>Gestão de alunos</h1>
      <p class="sub">Entre com seu login e senha</p>
    </div>
    <form id="formLogin">
      <label for="loginSlug">Login</label>
      <input type="text" id="loginSlug" autocomplete="username" required
             placeholder="tc-fitness" autocapitalize="none" spellcheck="false">

      <label for="loginSenha">Senha</label>
      <input type="password" id="loginSenha" autocomplete="current-password" required>

      <button type="submit" id="btnLogin">Entrar</button>
      <div id="loginErro"></div>
    </form>
  </div>
</div>

<!-- ================= HEADER ================= -->
<header>
  <div class="wrap header-flex">
    <div class="header-esq">
      <div id="logoCard"><img id="logoImg1" alt=""></div>
      <div id="logoSolto"><img id="logoImg2" alt=""></div>
      <div class="header-title">
        <span class="tag" id="tagCliente">Painel do treinador</span>
        <h1>Gestão de alunos</h1>
      </div>
    </div>
    <div class="header-dir">
      <span id="usuarioEmail"></span>
      <button class="btn-sair" id="btnSair">Sair</button>
    </div>
  </div>
</header>

<div class="conteudo">
<div class="wrap">

  <div class="stats">
    <div class="stat"><div class="num" id="stTotal">—</div><div class="lbl">Fichas recebidas</div></div>
    <div class="stat destaque"><div class="num" id="stFecharam">—</div><div class="lbl">Fecharam</div></div>
    <div class="stat"><div class="num" id="stAtivos">—</div><div class="lbl">Ativos</div></div>
    <div class="stat vermelho"><div class="num" id="stAtrasados">—</div><div class="lbl">Análise atrasada +30d</div></div>
  </div>

  <!-- caixa de solicitações pendentes -->
  <div id="caixaSolicitacoes"></div>

  <div class="controles">
    <div class="busca"><input type="text" id="busca" placeholder="Buscar por nome, e-mail ou WhatsApp..."></div>
    <div class="filtros">
      <button class="chip on" data-filtro="todos">Todos</button>
      <button class="chip" data-filtro="fechou">Fecharam</button>
      <button class="chip" data-filtro="nao_fechou">Não fecharam</button>
      <button class="chip" data-filtro="ativo">Ativos</button>
      <button class="chip" data-filtro="inativo">Inativos</button>
      <button class="chip" data-filtro="atrasado">Análise atrasada</button>
    </div>
  </div>

  <div class="carregando" id="carregando">Carregando alunos...</div>
  <div class="lista" id="lista"></div>
  <div class="vazio" id="vazio" style="display:none">
    <strong>Nenhum aluno encontrado</strong>
    Ajuste a busca ou os filtros.
  </div>
</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-top">
      <h2 id="mNome">Aluno</h2>
      <button class="fechar" id="btnFechar" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<footer>
  <div class="wrap foot-flex">
    <div class="foot-brand" id="footBrand">—</div>
    <div class="contatos" id="footContatos"></div>
  </div>
</footer>

<script>
/* =========================================================
   ⚙️ CONFIGURAÇÃO
   Supabase > Settings > API. A chave publishable/anon é
   pública por natureza — quem protege o dado é o RLS.
   ========================================================= */
const SUPABASE_URL      = "https://sloamqnvbstpihfzsfqk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tyCGNNaJeiD39y9fVPBmGg_nC2Oonev";

const DIAS_ALERTA = 30;   // dias sem análise para acender o alerta

/* Domínio técnico interno. O treinador NUNCA vê isto.
   Ele digita só o login (o slug do cliente) e a senha.
   O Auth continua por baixo — é ele que emite o token
   que faz o RLS separar um cliente do outro. */
const DOMINIO_LOGIN = "@painel.local";
/* ========================================================= */

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let CLIENTE = null;    // vem de meu_tema()
let alunos  = [];      // vem de fichas_cadastrais
let filtroAtivo = 'todos';
let termoBusca  = '';
let alunoAberto = null;

const lista   = document.getElementById('lista');
const vazio   = document.getElementById('vazio');
const overlay = document.getElementById('overlay');
const carregando = document.getElementById('carregando');


/* =========================================================
   HELPERS
   ========================================================= */
const fmtData = d => {
  if (!d) return '—';
  const [a, m, dia] = String(d).slice(0,10).split('-');
  return `${dia}/${m}/${a}`;
};
const diasDesde = d => d ? Math.floor((Date.now() - new Date(d + 'T12:00:00')) / 86400000) : Infinity;
const analiseAtrasada = a => a.ativo && diasDesde(a.ultima_analise) > DIAS_ALERTA;
const respostaAlerta = v => v && !/^n[ãa]o$/i.test(String(v).trim());
const soNumeros = s => (s || '').replace(/\D/g, '');
const esc = s => String(s ?? '—').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


/* =========================================================
   1. LOGIN
   ========================================================= */
document.getElementById('formLogin').addEventListener('submit', async e => {
  e.preventDefault();
  const btn  = document.getElementById('btnLogin');
  const erro = document.getElementById('loginErro');
  erro.classList.remove('mostrar');
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  // o login digitado é o slug do cliente; vira e-mail técnico aqui
  const slug  = document.getElementById('loginSlug').value.trim().toLowerCase();
  const senha = document.getElementById('loginSenha').value;
  const email = slug + DOMINIO_LOGIN;

  const { error } = await db.auth.signInWithPassword({ email, password: senha });

  if (error) {
    erro.textContent = error.message.includes('Invalid login')
      ? 'Login ou senha incorretos.'
      : 'Não foi possível entrar. Tente de novo.';
    erro.classList.add('mostrar');
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }
  await iniciarPainel();
});

document.getElementById('btnSair').addEventListener('click', async () => {
  await db.auth.signOut();
  location.reload();
});


/* =========================================================
   2. TEMA E LOGO — tudo vem da tabela `clientes`
   ========================================================= */
function aplicarTema(c) {
  const r = document.documentElement.style;
  r.setProperty('--primaria', c.cor_primaria);
  r.setProperty('--escura',   c.cor_escura);
  r.setProperty('--destaque', c.cor_destaque);
  r.setProperty('--bg',       c.cor_fundo);
  r.setProperty('--ink',      c.cor_texto);
  r.setProperty('--err',      c.cor_erro);

  document.getElementById('tagCliente').textContent = c.nome;
  document.getElementById('footBrand').textContent  = c.nome;
  document.title = `Gestão de Alunos — ${c.nome}`;

  // logo: fundo branco vai dentro do card, transparente vai solto
  if (c.logo_url) {
    const alvo = (c.logo_fundo === 'transparente') ? 'logoSolto' : 'logoCard';
    const img  = (alvo === 'logoSolto') ? 'logoImg2' : 'logoImg1';
    document.getElementById(img).src = c.logo_url;
    document.getElementById(img).alt = c.logo_alt || c.nome;
    document.getElementById(alvo).classList.add('mostrar');

    const ll = document.getElementById('loginLogo');
    ll.src = c.logo_url; ll.alt = c.logo_alt || c.nome;
    ll.classList.add('mostrar');
  }

  // rodapé com os contatos do cliente
  const fc = document.getElementById('footContatos');
  fc.innerHTML = '';
  if (c.whatsapp)  fc.innerHTML += `<a href="https://wa.me/${soNumeros(c.whatsapp)}" target="_blank" rel="noopener">📱 ${esc(c.whatsapp)}</a>`;
  if (c.instagram) fc.innerHTML += `<a href="https://instagram.com/${esc(c.instagram)}" target="_blank" rel="noopener">📸 @${esc(c.instagram)}</a>`;
  if (c.email)     fc.innerHTML += `<a href="mailto:${esc(c.email)}">✉️ ${esc(c.email)}</a>`;
}


/* =========================================================
   3. CARREGAR ALUNOS
   O RLS já filtra pelo cliente do login. Não precisa de
   .eq('cliente_id', ...) aqui — e é justamente por isso
   que a segurança não depende deste arquivo.
   ========================================================= */
async function carregarAlunos() {
  carregando.style.display = 'block';
  lista.innerHTML = '';
  vazio.style.display = 'none';

  const { data, error } = await db
    .from('fichas_cadastrais')
    .select('*')
    .order('criado_em', { ascending: false });

  carregando.style.display = 'none';

  if (error) {
    console.error(error);
    vazio.style.display = 'block';
    vazio.innerHTML = '<strong>Erro ao carregar</strong>Recarregue a página. Se persistir, verifique sua conexão.';
    return;
  }
  alunos = data || [];
  await carregarEngajamento();
  renderStats();
  renderLista();
  carregarSolicitacoes();
}


/* =========================================================
   3.1 ENGAJAMENTO — quem treinou, quem sumiu
   Junta os check-ins aos alunos para o painel mostrar
   quem está firme e quem parou de aparecer.
   ========================================================= */
let engajamento = {};   // { ficha_id: {ultimo_treino, treinos_7d, treinos_30d} }

async function carregarEngajamento() {
  engajamento = {};
  const { data, error } = await db.from('checkins')
    .select('ficha_id,data,treinou,peso_dia')
    .gte('data', new Date(Date.now() - 45*86400000).toISOString().slice(0,10))
    .order('data', { ascending:false });
  if (error) { console.warn('engajamento:', error.message); return; }

  const hoje = new Date();
  (data||[]).forEach(c => {
    const e = engajamento[c.ficha_id] || (engajamento[c.ficha_id] = { treinos_7d:0, treinos_30d:0, ultimo:null, pesos:[] });
    const dias = Math.floor((hoje - new Date(c.data + 'T12:00:00')) / 86400000);
    if (c.treinou) {
      if (dias <= 7)  e.treinos_7d++;
      if (dias <= 30) e.treinos_30d++;
      if (!e.ultimo || c.data > e.ultimo) e.ultimo = c.data;
    }
    if (c.peso_dia) e.pesos.push({ data:c.data, peso:Number(c.peso_dia) });
  });
}

function diasSemTreinar(a) {
  const e = engajamento[a.id];
  if (!e || !e.ultimo) return null;
  return Math.floor((Date.now() - new Date(e.ultimo + 'T12:00:00')) / 86400000);
}

// badge que mostra o engajamento do aluno na lista
function badgeEngajamento(a) {
  if (!a.ativo) return '';
  const e = engajamento[a.id];
  const d = diasSemTreinar(a);
  if (d === null) return '<span class="badge badge-sumido">Sem check-in</span>';
  if (d >= 7)     return `<span class="badge badge-sumido">${d}d sem treinar</span>`;
  if (e && e.treinos_7d >= 3) return `<span class="badge badge-firme">${e.treinos_7d}x essa semana</span>`;
  return '';
}

/* ---------- gráfico de peso (SVG puro, sem biblioteca) ---------- */
function graficoPeso(pontos, cor) {
  if (!pontos || pontos.length < 2) {
    return '<div class="grafico-vazio">Ainda não há pesos suficientes para o gráfico.<br>O aluno registra o peso no check-in do app.</div>';
  }
  const p = [...pontos].sort((a,b) => a.data < b.data ? -1 : 1);
  const W = 300, H = 110, PAD = 8;
  const pesos = p.map(x => x.peso);
  const min = Math.min(...pesos), max = Math.max(...pesos);
  const range = (max - min) || 1;
  const px = i => PAD + (i * (W - 2*PAD)) / (p.length - 1);
  const py = v => PAD + (H - 2*PAD) * (1 - (v - min) / range);

  const linha = p.map((x,i) => `${i?'L':'M'}${px(i).toFixed(1)},${py(x.peso).toFixed(1)}`).join(' ');
  const area  = linha + ` L${px(p.length-1).toFixed(1)},${H} L${px(0).toFixed(1)},${H} Z`;
  const bolas = p.map((x,i) => `<circle cx="${px(i).toFixed(1)}" cy="${py(x.peso).toFixed(1)}" r="3" fill="${cor}"/>`).join('');

  const ini = p[0], fim = p[p.length-1];
  const dif = (fim.peso - ini.peso).toFixed(1);
  const sinal = dif > 0 ? '+' : '';

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <path d="${area}"  fill="${cor}" opacity=".12"/>
      <path d="${linha}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round"/>
      ${bolas}
    </svg>
    <div class="mini-stats">
      <div><b>${ini.peso} kg</b><span>${fmtData(ini.data)}</span></div>
      <div><b>${fim.peso} kg</b><span>${fmtData(fim.data)}</span></div>
      <div><b style="color:${dif<0?'#5C7414':dif>0?'#9A5A12':'inherit'}">${sinal}${dif} kg</b><span>variação</span></div>
    </div>`;
}


/* =========================================================
   3.2 SOLICITAÇÕES PENDENTES
   ========================================================= */
async function carregarSolicitacoes() {
  const box = document.getElementById('caixaSolicitacoes');
  const { data, error } = await db.from('solicitacoes')
    .select('*').eq('status','aberta').order('criado_em', { ascending:false });
  if (error) { console.warn('solicitacoes:', error.message); box.innerHTML=''; return; }
  if (!data || !data.length) { box.innerHTML = ''; return; }

  box.innerHTML = `
    <div class="sol-box">
      <h3>⏳ ${data.length} solicitaç${data.length>1?'ões':'ão'} aguardando você</h3>
      ${data.map(s => {
        const al = alunos.find(a => a.id === s.ficha_id);
        const nome = al ? al.nome_completo : 'Aluno';
        const zap = al ? 'https://wa.me/55' + soNumeros(al.whatsapp) : '#';
        return `
        <div class="sol-item">
          <div>
            <div class="quem">${esc(nome)}
              <span class="sol-tipo">${s.tipo==='novo_treino'?'Novo treino':'Acompanhamento'}</span>
            </div>
            <div class="quando">Pedido em ${fmtData(s.criado_em)}</div>
          </div>
          <div class="sol-acoes">
            <a class="sol-btn" href="${zap}" target="_blank" rel="noopener">💬 Responder</a>
            ${al ? `<a class="sol-btn" href="treino.html?ficha=${al.id}">🏋️ Treino</a>` : ''}
            <button class="sol-btn ok" onclick="resolverSolicitacao('${s.id}')">✓ Resolver</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

window.resolverSolicitacao = async (id) => {
  const { error } = await db.from('solicitacoes')
    .update({ status:'resolvida', resolvido_em: new Date().toISOString() }).eq('id', id);
  if (error) { alert('Não consegui marcar como resolvida.'); return; }
  carregarSolicitacoes();
};


/* =========================================================
   4. INICIAR PAINEL (depois do login)
   ========================================================= */
async function iniciarPainel() {
  const { data: tema, error } = await db.rpc('meu_tema');

  if (error || !tema || tema.length === 0) {
    const erro = document.getElementById('loginErro');
    erro.textContent = 'Seu login não está vinculado a nenhum cliente. Fale com o administrador.';
    erro.classList.add('mostrar');
    document.getElementById('btnLogin').disabled = false;
    document.getElementById('btnLogin').textContent = 'Entrar';
    await db.auth.signOut();
    return;
  }

  CLIENTE = tema[0];
  aplicarTema(CLIENTE);

  const { data: { user } } = await db.auth.getUser();
  // esconde o domínio técnico: mostra só o login
  document.getElementById('usuarioEmail').textContent =
    (user?.email || '').replace(DOMINIO_LOGIN, '');

  document.getElementById('telaLogin').classList.add('sumiu');
  await carregarAlunos();
}


/* =========================================================
   5. LISTA E FILTROS
   ========================================================= */
function renderStats() {
  document.getElementById('stTotal').textContent     = alunos.length;
  document.getElementById('stFecharam').textContent  = alunos.filter(a => a.fechou).length;
  document.getElementById('stAtivos').textContent    = alunos.filter(a => a.ativo).length;
  document.getElementById('stAtrasados').textContent = alunos.filter(analiseAtrasada).length;
}

function filtrar() {
  return alunos.filter(a => {
    const t = termoBusca.toLowerCase();
    const bateBusca = !t ||
      (a.nome_completo || '').toLowerCase().includes(t) ||
      (a.email || '').toLowerCase().includes(t) ||
      soNumeros(a.whatsapp).includes(soNumeros(t) || '§');
    if (!bateBusca) return false;
    switch (filtroAtivo) {
      case 'fechou':     return a.fechou;
      case 'nao_fechou': return !a.fechou;
      case 'ativo':      return a.ativo;
      case 'inativo':    return !a.ativo;
      case 'atrasado':   return analiseAtrasada(a);
      default:           return true;
    }
  });
}

function renderLista() {
  const itens = filtrar();
  lista.innerHTML = '';
  vazio.style.display = itens.length ? 'none' : 'block';

  itens.forEach(a => {
    const el = document.createElement('div');
    el.className = 'aluno' + (a.ativo ? ' at' : '');
    el.innerHTML = `
      <div>
        <div class="nome">${esc(a.nome_completo)}</div>
        <div class="sub">
          <span>🎯 ${esc(a.objetivo_principal)}</span>
          <span>📱 ${esc(a.whatsapp)}</span>
          <span>📅 Última análise: ${fmtData(a.ultima_analise)}</span>
        </div>
      </div>
      <div class="badges">
        <span class="badge ${a.fechou ? 'b-fechou' : 'b-nao-fechou'}">${a.fechou ? 'Fechou' : 'Não fechou'}</span>
        <span class="badge ${a.ativo ? 'b-ativo' : 'b-inativo'}">${a.ativo ? 'Ativo' : 'Inativo'}</span>
        ${analiseAtrasada(a) ? '<span class="badge b-atrasado">Análise atrasada</span>' : ''}
        ${badgeEngajamento(a)}
      </div>`;
    el.addEventListener('click', () => abrirModal(a));
    lista.appendChild(el);
  });
}


/* =========================================================
   6. MODAL DO ALUNO
   ========================================================= */

      <h3>Gestão do aluno</h3>

        </div>
        <div class="g-item">
          <span class="g-lbl">Status do aluno</span>
          <div class="toggle" id="tgAtivo">
            <button data-v="true"  class="${a.ativo ? 'sel-destaque' : ''}">Ativo</button>
            <button data-v="false" class="${!a.ativo ? 'sel-cinza' : ''}">Inativo</button>
          </div>
        </div>
        <div class="g-item">
          <span class="g-lbl">Data da última análise</span>
          <input type="date" id="inpAnalise" value="${a.ultima_analise ? String(a.ultima_analise).slice(0,10) : ''}">
        </div>
      </div>

        <span class="g-lbl">Observações internas (o aluno não vê)</span>
        <textarea id="inpObs" placeholder="Ex: prefere treino curto, viaja toda quinta...">${esc(a.observacoes || '').replace(/—/g,'')}</textarea>
      </div>

      <p class="salvo-msg" id="salvoMsg"></p>
    </div>

    <div class="grafico-wrap">

      ${graficoPeso((engajamento[a.id]||{}).pesos, getComputedStyle(document.documentElement).getPropertyValue('--primaria').trim() || '#39556A')}

    <div class="secao">

      ${dado('Treinos nos últimos 7 dias', (engajamento[a.id]||{}).treinos_7d ?? 0)}
      ${dado('Treinos nos últimos 30 dias', (engajamento[a.id]||{}).treinos_30d ?? 0)}

      <h4>Contato e perfil</h4>

      ${dado('Idade', a.idade ? a.idade + ' anos' : '—')}

      <h4>Medidas e hábitos</h4>
      ${dado('Peso', a.peso_kg ? a.peso_kg + ' kg' : '—')}
      ${dado('Altura', a.altura_m ? a.altura_m + ' m' : '—')}
      ${dado('IMC', imc)}
      ${dado('Alimentação', a.alimentacao_atual)}

  overlay.classList.add('aberto');
  document.body.style.overflow = 'hidden';
}

function configurarToggle(id, classeSim, classeNao) {
  const box = document.getElementById(id);
  box.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      box.querySelectorAll('button').forEach(x => { x.className = ''; x.removeAttribute('data-sel'); });
      b.className = b.dataset.v === 'true' ? classeSim : classeNao;
      b.setAttribute('data-sel', '1');
    });
  });
  // marca o que já está selecionado na abertura (tem classe inicial)
  const inicial = box.querySelector('button[class]');
  if (inicial) inicial.setAttribute('data-sel', '1');
}

function lerToggle(id) {
  const sel = document.querySelector(`#${id} button[data-sel]`);
  return sel ? sel.dataset.v === 'true' : false;
}


/* =========================================================
   7. SALVAR (UPDATE no banco)
   ========================================================= */
async function salvarAlteracoes() {
  const a   = alunoAberto;
  const btn = document.getElementById('btnSalvar');
  const msg = document.getElementById('salvoMsg');
  msg.className = 'salvo-msg';

  const mudancas = {
    fechou: lerToggle('tgFechou'),
    ativo:  lerToggle('tgAtivo'),
    ultima_analise: document.getElementById('inpAnalise').value || null,
    observacoes: document.getElementById('inpObs').value.trim() || null
  };

  btn.disabled = true;
  btn.textContent = 'Salvando...';

  const { error } = await db
    .from('fichas_cadastrais')
    .update(mudancas)
    .eq('id', a.id);

  btn.disabled = false;
  btn.textContent = 'Salvar alterações';

  if (error) {
    console.error(error);
    msg.className = 'salvo-msg falha';
    msg.textContent = '✕ Não foi possível salvar. Tente de novo.';
    return;
  }

  Object.assign(a, mudancas);   // atualiza a lista local
  msg.className = 'salvo-msg ok';
  msg.textContent = '✓ Alterações salvas';
  setTimeout(() => msg.className = 'salvo-msg', 2200);
  renderStats();
  renderLista();
}


/* =========================================================
   8. FECHAR MODAL / BUSCA / FILTROS
   ========================================================= */
function fecharModal() {
  overlay.classList.remove('aberto');
  document.body.style.overflow = '';
  alunoAberto = null;
}
document.getElementById('btnFechar').addEventListener('click', fecharModal);
overlay.addEventListener('click', e => { if (e.target === overlay) fecharModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

document.getElementById('busca').addEventListener('input', e => {
  termoBusca = e.target.value.trim();
  renderLista();
});
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    filtroAtivo = c.dataset.filtro;
    renderLista();
  });
});


/* =========================================================
   9. START — se já tem sessão salva, entra direto
   ========================================================= */
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) await iniciarPainel();
})();
