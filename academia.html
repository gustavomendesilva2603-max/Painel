<title>Academia Muay Thai</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de celular com duas visões (treinador / aluno); login na entrada, barra de navegação fixa embaixo */
:root{
  --bg:#f2f4f3; --card:#ffffff; --ink:#14201b; --muted:#66756f; --line:#e1e6e3; --soft:#eef2f0;
  --accent:#0e7a5a; --accent-ink:#ffffff; --hero:#0e7a5a; --hero2:#0a5f46; --hero-ink:#ffffff; --hero-mute:rgba(255,255,255,.74);
  --tcard:#14201b; --tcard-ink:#f1f6f3; --tcard-mute:rgba(241,246,243,.7);
  --warn:#cc4a2a; --ok:#1c9467; --amber:#c98714; --info:#2f7fc0;
  --cond:#e0613f; --tec:#2f9ae0; --forca:#8a978f;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 6px 20px rgba(20,32,27,.06);
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1311; --card:#17201c; --ink:#e8eeeb; --muted:#97a69f; --line:#25312c; --soft:#1e2a25;
  --accent:#34c08f; --accent-ink:#05251a; --hero:#135a41; --hero2:#0e4633; --hero-ink:#f1f7f4; --hero-mute:rgba(241,247,244,.72);
  --tcard:#22302a; --tcard-ink:#eef4f1; --tcard-mute:rgba(238,244,241,.68);
  --warn:#ef7a5a; --ok:#3fcf95; --amber:#e9ad3e; --info:#62a8dc;
  --cond:#ef7a5a; --tec:#58b4ef; --forca:#8f9e97; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1311; --card:#17201c; --ink:#e8eeeb; --muted:#97a69f; --line:#25312c; --soft:#1e2a25;
  --accent:#34c08f; --accent-ink:#05251a; --hero:#135a41; --hero2:#0e4633; --hero-ink:#f1f7f4; --hero-mute:rgba(241,247,244,.72);
  --tcard:#22302a; --tcard-ink:#eef4f1; --tcard-mute:rgba(238,244,241,.68);
  --warn:#ef7a5a; --ok:#3fcf95; --amber:#e9ad3e; --info:#62a8dc;
  --cond:#ef7a5a; --tec:#58b4ef; --forca:#8f9e97; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.22); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
body.nologin{padding-bottom:24px}
.app{max-width:560px;margin:0 auto}
.screen{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:700} h2{font-size:1.1rem;font-weight:700} h3{font-size:1rem;font-weight:700}
svg{flex:none}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.topbar small{display:block;color:var(--muted);font-size:.85rem}
.role{display:inline-flex;align-items:center;gap:6px;font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.08em;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent)}
.testbar{font-size:.78rem;text-align:center;color:var(--muted);background:var(--soft);border-radius:10px;padding:6px 10px}
.btn{font:700 .95rem var(--body);border:0;border-radius:12px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.out{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--warn);color:#fff}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;pointer-events:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;pointer-events:none}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{font:500 1rem var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font-size:.8rem;font-weight:600;color:var(--muted)}
.status{font-size:.88rem;min-height:1.2em}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;padding:9px 6px;background:transparent;color:var(--muted);font:600 .9rem var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:4px;font:700 .7rem var(--body);text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.p-amber{background:color-mix(in srgb,var(--amber) 18%,var(--card));color:var(--amber)}
.p-warn{background:color-mix(in srgb,var(--warn) 15%,var(--card));color:var(--warn)}
.p-info{background:color-mix(in srgb,var(--info) 15%,var(--card));color:var(--info)}
.p-mute{background:var(--soft);color:var(--muted)}
.ex-badge{font:600 .7rem var(--body);color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:2px 8px}
/* login */
.login{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:420px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.brand .lg{width:52px;height:52px;border-radius:16px;background:linear-gradient(160deg,var(--hero),var(--hero2));color:#fff;display:flex;align-items:center;justify-content:center}
.brand .lg svg{width:28px;height:28px}
.brand h1{font-size:1.5rem}
/* treinador */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis button{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);min-width:0;border:0;text-align:left;cursor:pointer;color:var(--ink)}
.kpis button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.kpis b{display:block;font:700 1.4rem var(--display)}
.kpis span{font-size:.75rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border:0;width:100%;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:700 .95rem var(--display);color:#fff}
.row .tx{flex:1;min-width:0}
.row .tx strong{display:block;font-weight:700}
.row .tx small{display:block;color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.alert{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--warn)}
.alert svg{width:16px;height:16px;margin-top:2px}
.dhead{display:flex;align-items:center;gap:12px}
.dhead .av{width:56px;height:56px;font-size:1.1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--soft);border-radius:12px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kv b{display:block;font-weight:700;overflow-wrap:anywhere}
.kv.full{grid-column:1/-1}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.dots i{aspect-ratio:1;border-radius:4px;background:var(--soft);max-width:100%}
.dots i.s{background:var(--accent)} .dots i.p{background:color-mix(in srgb,var(--accent) 40%,var(--soft))} .dots i.d{background:var(--warn)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.92rem}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch input:checked{background:var(--warn)}.switch input:checked::after{left:23px}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.note small{display:block;color:var(--muted);font-size:.75rem;margin-bottom:2px}
.feed{display:flex;flex-direction:column;gap:10px}
.fi{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.fi .h{display:flex;align-items:center;gap:10px}
.fi .h .av{width:34px;height:34px;font-size:.78rem}
.fi .h div{flex:1;min-width:0}
.fi .h strong{display:block;font-weight:700;font-size:.95rem}
.fi .h small{color:var(--muted);font-size:.78rem}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk div{background:var(--soft);border-radius:8px;padding:6px 2px;text-align:center;font-size:.68rem;min-width:0}
.wk div b{display:block;font-size:.7rem;color:var(--muted)}
.wk div.rest{opacity:.55}
/* aluno / treino */
.thero{background:var(--tcard);color:var(--tcard-ink);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.thero small{font-size:.75rem;color:var(--tcard-mute);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.thero h2{font-size:1.4rem}
.tstats{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--tcard-mute)}
.tstats b{color:var(--tcard-ink);font-family:var(--display)}
.tog{display:inline-grid;grid-auto-flow:column;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;gap:3px;align-self:flex-start}
.tog button{border:0;border-radius:8px;padding:6px 12px;background:transparent;color:var(--tcard-mute);font:600 .82rem var(--body);cursor:pointer}
.tog button[aria-pressed="true"]{background:var(--tcard-ink);color:var(--tcard)}
.tprog{display:flex;flex-direction:column;gap:6px}
.tprog .t{display:flex;justify-content:space-between;font-size:.82rem;color:var(--tcard-mute)}
.tprog .b{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.tprog .b i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.dstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dstrip button{border:0;border-radius:12px;padding:9px 0;background:var(--card);color:var(--ink);font:600 .8rem var(--body);cursor:pointer;box-shadow:var(--shadow)}
.dstrip button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dstrip button.today{outline:2px solid var(--accent);outline-offset:-2px}
.blk{display:flex;flex-direction:column}
.blabel{display:flex;align-items:center;gap:8px;font:700 .75rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 0 6px}
.blabel .c{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.ex{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.blk .ex:first-of-type{border-top:0}
.ex input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);margin:0;display:grid;place-content:center;cursor:pointer}
.ex input:checked{background:var(--accent);border-color:var(--accent)}
.ex input:checked::after{content:"";width:10px;height:5px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.ex input:disabled{opacity:.4;cursor:default}
.ex .nm{min-width:0}
.ex .nm strong{display:block;font-weight:600}
.ex .nm small{display:block;color:var(--muted);font-size:.82rem}
.ex.done .nm strong{text-decoration:line-through;color:var(--muted)}
.qtd{font:700 .95rem var(--display);text-align:right;white-space:nowrap}
.qtd a{display:inline-flex;font:700 .72rem var(--body);color:var(--accent);text-decoration:none;margin-top:4px;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.ex.plain{grid-template-columns:1fr auto}
.q{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q > span{font-weight:500}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{min-width:42px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 .85rem var(--body);cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hist{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hist div{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted)}
.hist .full{background:var(--accent);color:var(--accent-ink);font-weight:700}
.hist .part{background:color-mix(in srgb,var(--accent) 35%,var(--soft));color:var(--ink)}
.hist .fut{opacity:.35} .hist .hd{background:transparent;font-weight:700}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--accent);margin-bottom:6px}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);background:none;border:0;font:600 .72rem var(--body);cursor:pointer;position:relative}
.nav button svg{width:24px;height:24px;pointer-events:none}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:99px;background:var(--warn);color:#fff;font-size:.65rem;display:flex;align-items:center;justify-content:center;padding:0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--tcard);color:var(--tcard-ink);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.screen{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="brand"><span class="lg" id="lgIc"></span><div><h1>Academia Muay Thai</h1><span class="muted small">Treinos, fichas e check-ins</span></div></div>
  <section class="card">
    <div class="fld"><span>Entrar como</span><div class="seg" id="roleSeg"><button type="button" data-r="aluno">Aluno</button><button type="button" data-r="treinador">Treinador</button></div></div>
    <label class="fld"><span>Usuário</span><input type="text" id="lUser" autocomplete="username" autocapitalize="none" placeholder="teste"></label>
    <label class="fld"><span>Senha</span><input type="password" id="lPass" autocomplete="current-password" placeholder="••••"></label>
    <button class="btn block" id="lGo" type="button">Entrar</button>
    <div class="status" id="lSt" role="status"></div>
  </section>
  <div class="testbar">Versão de teste · usuário <b>teste</b> · senha <b>1234</b></div>
</div>

<div class="app" id="app" hidden>
  <div id="view" class="screen"></div>
</div>
<nav class="nav" id="nav" hidden><div id="navIn"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
const YT=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
// t: cond | tec | forca ; arm: pesa no braço
const EX={
  polichinelo:{n:"Polichinelo",q:"1 min",t:"cond",v:"polichinelo execução correta"},
  rotacao:{n:"Rotação de ombro, quadril e tornozelo",q:"1 min",t:"cond",d:"10 voltas pra cada lado",v:"mobilidade articular aquecimento"},
  corrida:{n:"Corrida parada leve",q:"1 min",t:"cond",d:"Pisando na ponta do pé, como na base do muay thai",v:"corrida estacionária exercício"},
  corda:{n:"Pular corda (ou simular)",q:"2 min",t:"cond",v:"pular corda imaginária exercício"},
  guarda:{n:"Base e guarda",q:"1 min",t:"tec",d:"Pés na largura do ombro, peso no meio, mãos na altura da testa, queixo baixo",v:"base e guarda muay thai iniciante"},
  jab:{n:"Jab-direto (1-2) devagar",q:"2 × 1 min",t:"tec",d:"Gira o pé de trás no direto e a mão volta pro rosto",v:"jab direto muay thai iniciante"},
  cruzado:{n:"Jab-direto-cruzado (1-2-3)",q:"2 × 1 min",t:"tec",d:"No cruzado, gira o pé da frente e o cotovelo fica na altura do punho",v:"cruzado muay thai técnica iniciante"},
  socoRapido:{n:"Socos rápidos sem parar",q:"4 × 20s",t:"cond",arm:1,d:"40s de pausa. Soco leve e rápido, não força o ombro",v:"socos rápidos condicionamento boxe"},
  shadowSoco:{n:"Shadow só de socos",q:"3 × 2 min",t:"cond",d:"1 min de pausa. Mexe a cabeça e as pernas enquanto soca",v:"shadow boxing socos iniciante"},
  flexao:{n:"Flexão (pode ser com joelho no chão)",q:"3 × 8",t:"forca",arm:1,d:"Corpo reto, desce até o peito quase encostar",v:"flexão de braço execução correta iniciante"},
  lateral:{n:"Elevação lateral com garrafa",q:"2 × 12",t:"forca",arm:1,d:"Garrafa de 1,5L, sobe até o ombro e desce devagar",v:"elevação lateral execução correta"},
  prancha:{n:"Prancha",q:"3 × 30s",t:"forca",d:"Corpo reto, sem quadril caído",v:"prancha abdominal execução correta"},
  agach:{n:"Agachamento",q:"3 × 15",t:"forca",d:"Joelho na linha do pé, desce até a coxa ficar paralela",v:"agachamento livre execução correta"},
  afundo:{n:"Afundo",q:"3 × 10",t:"forca",d:"10 por perna",v:"afundo execução correta"},
  pantu:{n:"Panturrilha em pé",q:"3 × 20",t:"forca",d:"Sobe na ponta do pé e segura 1s em cima",v:"elevação de panturrilha em pé em casa"},
  salto:{n:"Agachamento com salto",q:"3 × 8",t:"cond",d:"Aterrissa macio, joelho levemente dobrado",v:"agachamento com salto execução"},
  chuteBaixo:{n:"Chute baixo devagar",q:"2 × 10 cada perna",t:"tec",d:"Gira no pé de apoio e bate com a canela, não com o pé",v:"chute baixo muay thai técnica iniciante"},
  teep:{n:"Teep (chute frontal)",q:"2 × 10 cada perna",t:"tec",d:"Sobe o joelho primeiro e empurra com a sola do pé",v:"teep muay thai técnica iniciante"},
  joelhada:{n:"Joelhada alternada",q:"4 × 30s",t:"cond",d:"30s de pausa. Puxa os braços pra baixo enquanto sobe o joelho",v:"joelhada muay thai treino em casa"},
